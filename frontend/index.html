<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beyblade Burst Telugu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>BEYBLADE BURST</h1>
        <p>231-episode continuous player</p>
    </header>

    <main>

        <button id="continueBtn" class="continue-btn">
            ▶ Continue
        </button>

        <section class="player-section">

            <video
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            ></video>

            <div id="status" class="status">
                Ready
            </div>

        </section>

        <section class="episode-controls">

            <h2 id="currentEpisode">
                Episode 1
            </h2>

            <div class="navigation">

                <button id="previousBtn">
                    ⏮ Previous
                </button>

                <button id="nextBtn">
                    Next ⏭
                </button>

            </div>

            <label class="autonext">
                <input type="checkbox" id="autoNext" checked>
                Auto Next
            </label>

        </section>


        <section class="episodes-section">

            <h2>Episodes</h2>

            <input
                type="search"
                id="searchBox"
                placeholder="Search episode or season"
                autocomplete="off"
            >

            <div id="episodeList"></div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
